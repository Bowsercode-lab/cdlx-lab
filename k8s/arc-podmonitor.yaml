# Scrape ARC metrics (gha_*). Turn the endpoints on first in the gha-runner-scale-set-controller values:
#   metrics:
#     controllerManagerAddr: ":8080"
#     listenerAddr: ":8080"
#     listenerEndpoint: "/metrics"
# (docs.github.com > Actions Runner Controller > Deploy runner scale sets > Enabling metrics)
# Namespace: Cardlytics runs ARC in github-arc-systems; change if yours differs.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: arc-listeners
  namespace: github-arc-systems
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: runner-scale-set-listener
  podMetricsEndpoints:
    - targetPort: 8080
      path: /metrics
      interval: 30s
      metricRelabelings:
        # job histograms can carry per-runner labels; drop them to keep cardinality flat
        - action: labeldrop
          regex: runner_id|runner_name
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: arc-controller
  namespace: github-arc-systems
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: gha-rs-controller
  podMetricsEndpoints:
    - targetPort: 8080
      path: /metrics
      interval: 30s
