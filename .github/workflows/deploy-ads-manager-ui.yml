name: Deploy ads-manager-ui
on:
  push:
    branches: [main]
    paths: ["apps/ads-manager-ui/**"]
  workflow_dispatch:
    inputs:
      rollback: { type: boolean, default: false, description: "Redeploy an older commit on purpose" }
jobs:
  deploy:
    # A reusable workflow gets no more than its caller grants; org default tokens are read-only.
    permissions: { contents: write, pull-requests: read, actions: read }
    uses: ./.github/workflows/_deploy.yml
    with:
      service: ads-manager-ui
      team: dd-advertiser_ads_ui
      project-path: apps/ads-manager-ui
      environment: prod
      rollback: ${{ inputs.rollback || false }}
    secrets: inherit
