name: CI ads-manager-ui
on:
  pull_request:
    paths: ["apps/ads-manager-ui/**"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (lab stand-in; FLAKY makes about 1 in 4 runs fail so restarts-to-pass shows up)
        run: |
          sleep $((RANDOM % 20 + 5))
          if [ -f "apps/ads-manager-ui/FLAKY" ] && [ $((RANDOM % 4)) -eq 0 ]; then echo "flaky failure"; exit 1; fi
